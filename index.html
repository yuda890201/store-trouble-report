<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>現場トラブル・不具合クイック報告</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans"><header class="bg-gradient-to-r from-orange-600 to-amber-600 p-4 text-white shadow sticky top-0 z-20"><div class="max-w-md mx-auto flex justify-between items-center"><h1 class="font-bold text-base">現場トラブル・不具合クイック報告</h1><span class="text-[10px] bg-black/30 px-2 py-0.5 rounded-full font-mono">Live</span></div></header><main class="flex-1 p-4 max-w-md w-full mx-auto space-y-4"><div id="toast" class="p-3 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 rounded-xl text-xs font-semibold" style="display:none;">送信完了: データが保存されました！</div><div id="toast-error" class="p-3 bg-rose-500/20 border border-rose-500/40 text-rose-300 rounded-xl text-xs font-semibold" style="display:none;"></div><form onsubmit="appStudioSubmit(event)" class="space-y-3.5 bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-xl"><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">対象区分</label><select name="target_type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"><option value="店舗設備・什器">店舗設備・什器</option><option value="自作・業務アプリ">自作・業務アプリ</option></select></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">カテゴリ</label><select name="category" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"><option value="レジ・POS">レジ・POS</option><option value="フライヤー・厨房">フライヤー・厨房</option><option value="冷ケース・什器">冷ケース・什器</option><option value="アプリ不具合">アプリ不具合</option><option value="通信・ネットワーク">通信・ネットワーク</option><option value="その他">その他</option></select></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">クイックトラブル選択</label><select name="quick_trouble_preset" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"><option value="直接入力">直接入力</option><option value="ラベル・レシート詰まり">ラベル・レシート詰まり</option><option value="油温が上がらない">油温が上がらない</option><option value="冷却温度の異常">冷却温度の異常</option><option value="画面フリーズ・操作不能">画面フリーズ・操作不能</option><option value="通信エラー・同期失敗">通信エラー・同期失敗</option><option value="破損・異音発生">破損・異音発生</option></select></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">写真データ(Base64)</label><input type="text" name="photo_data" placeholder="" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">トラブル詳細・コメント</label><textarea name="comment" rows="3" placeholder="具体的な状況を記入してください" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"></textarea></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">発生・報告日時</label><input type="datetime-local" name="report_time" placeholder="" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">通知先Webhook URL</label><input type="text" name="webhook_endpoint" placeholder="" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"></div><button type="submit" class="w-full py-3 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl shadow text-xs mt-3">データを記録・送信する</button></form><p class="text-[10px] text-slate-500 leading-relaxed">入力内容は記録・保存されます。個人情報や機密情報は入力しないでください。</p></main></body><script>async function appStudioSubmit(event){event.preventDefault();const form=event.target;const button=form.querySelector('button[type=submit]');const toast=document.getElementById('toast');const failure=document.getElementById('toast-error');toast.style.display='none';failure.style.display='none';button.disabled=true;const label=button.textContent;button.textContent='送信中...';const data={};for(const el of form.elements){if(!el.name)continue;data[el.name]=(el.type==='checkbox')?el.checked:el.value;}try{const response=await fetch("https://app-studio-840352034351.asia-northeast1.run.app/api/submit/store-trouble-report",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});const result=await response.json().catch(()=>({}));if(!response.ok){throw new Error(result.error||('送信に失敗しました ('+response.status+')'));}toast.style.display='block';form.reset();setTimeout(()=>{toast.style.display='none';},4000);}catch(err){failure.textContent='送信できませんでした: '+err.message;failure.style.display='block';}finally{button.disabled=false;button.textContent=label;}}</script></html>
